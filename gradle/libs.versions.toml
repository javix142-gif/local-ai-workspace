navigation = "2.8.5"
room = "2.6.1"
gson = "2.14.0"
coroutines = "1.9.0"
documentfile = "1.0.1"
pdfbox = "2.0.27.0"
junit = "4.13.2"
coroutines-test = "1.9.0"
