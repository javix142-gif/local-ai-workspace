name: Android emulator instrumentation

on:
  push:
    branches:
      - feat/0.5.0-skills-agents
    paths:
      - '.github/workflows/android-emulator-instrumented.yml'
      - 'scripts/ci/collect_android_emulator_evidence.py'
      - 'app/**'
      - 'litert-compat/**'
      - 'llama-runtime/**'
      - 'third_party/llama.cpp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-instrumented-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected-instrumentation:
    name: API 35 x86_64 emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Initialize evidence folder
        run: |
          evidence_dir="$RUNNER_TEMP/android-emulator-evidence"
          mkdir -p "$evidence_dir" "$RUNNER_TEMP"
          printf '{"status":"RUNNING","runId":"%s","sourceCommit":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$evidence_dir/workflow-started.json"

      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK, NDK, CMake and API 35 image
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) 2>&1 | tee "$RUNNER_TEMP/sdk-licenses.log"
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.31.6' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64' \
            2>&1 | tee "$RUNNER_TEMP/sdkmanager.log"
          printf '%s\n%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          printf 'SDKMANAGER=%s\nAVDMANAGER=%s\n' "$SDKMANAGER" "$AVDMANAGER" > "$RUNNER_TEMP/android-toolchain.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | tee -a "$RUNNER_TEMP/android-toolchain.txt"

      - name: Verify and enable ephemeral runner KVM access
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kvm-check.txt"
          {
            printf 'runner_user=%s\n' "$(id -un)"
            printf 'runner_groups=%s\n' "$(id -Gn)"
            printf 'device_present=%s\n' "$([[ -c /dev/kvm ]] && echo true || echo false)"
            ls -l /dev/kvm 2>&1 || true
          } | tee "$report"
          if [[ ! -c /dev/kvm ]]; then
            echo 'KVM_DEVICE_MISSING' | tee -a "$report" >&2
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          {
            printf 'device_readable=%s\n' "$([[ -r /dev/kvm ]] && echo true || echo false)"
            printf 'device_writable=%s\n' "$([[ -w /dev/kvm ]] && echo true || echo false)"
            ls -l /dev/kvm
          } | tee -a "$report"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM_DEVICE_NOT_ACCESSIBLE' | tee -a "$report" >&2
            exit 1
          fi

      - name: Create and boot accelerated API 35 emulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          printf 'no\n' | "$AVDMANAGER" create avd --force \
            --name localai-api35-x86_64 \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_2 2>&1 | tee "$RUNNER_TEMP/avdmanager.log"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd localai-api35-x86_64 \
            -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -memory 2048 -cores 2 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          timeout 600 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 120); do
            booted="$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = '1' ]; then break; fi
            if [ "$attempt" -eq 120 ]; then
              echo 'Emulator did not finish booting in 10 minutes' >&2
              exit 1
            fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" devices -l | tee "$RUNNER_TEMP/adb-before-tests.txt"
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82 || true
          api="$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$api" = '35'
          test "$abi" = 'x86_64'

      - name: Run all connected Android instrumentation tests
        id: connected
        timeout-minutes: 55
        shell: bash
        run: |
          set +e
          ./gradlew :app:connectedDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-connected.log"
          gradle_status="${PIPESTATUS[0]}"
          printf 'exit_code=%s\n' "$gradle_status" >> "$GITHUB_OUTPUT"
          exit "$gradle_status"

      - name: Collect and validate instrumentation evidence
        if: always()
        env:
          GRADLE_EXIT_CODE: ${{ steps.connected.outputs.exit_code }}
          ANDROID_CI_EVIDENCE_DIR: ${{ runner.temp }}/android-emulator-evidence
        run: |
          set +e
          python3 scripts/ci/collect_android_emulator_evidence.py
          result=$?
          exit "$result"

      - name: Upload sanitized emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-emulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-emulator-evidence/
          if-no-files-found: error
          retention-days: 7
