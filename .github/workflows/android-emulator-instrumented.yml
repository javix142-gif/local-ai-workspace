name: Android emulator instrumentation

on:
  push:
    branches:
      - feat/0.5.0-skills-agents
    paths:
      - '.github/workflows/android-emulator-instrumented.yml'
      - 'scripts/ci/collect_android_emulator_evidence.py'
      - 'app/**'
      - 'litert-compat/**'
      - 'llama-runtime/**'
      - 'third_party/llama.cpp/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-instrumented-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected-instrumentation:
    name: API 35 x86_64 emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Initialize evidence folder
        run: |
          evidence_dir="$RUNNER_TEMP/android-emulator-evidence"
          mkdir -p "$evidence_dir" "$RUNNER_TEMP"
          printf '{"status":"RUNNING","runId":"%s","sourceCommit":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$evidence_dir/workflow-started.json"

      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK, NDK, CMake and API 35 image
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) 2>&1 | tee "$RUNNER_TEMP/sdk-licenses.log"
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.0.12077973' \
            'cmake;3.31.6' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64' \
            2>&1 | tee "$RUNNER_TEMP/sdkmanager.log"
          printf '%s\n%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          printf 'SDKMANAGER=%s\nAVDMANAGER=%s\n' "$SDKMANAGER" "$AVDMANAGER" > "$RUNNER_TEMP/android-toolchain.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | tee -a "$RUNNER_TEMP/android-toolchain.txt"

      - name: Verify and enable ephemeral runner KVM access
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kvm-check.txt"
          {
            printf 'runner_user=%s\n' "$(id -un)"
            printf 'runner_groups=%s\n' "$(id -Gn)"
            printf 'device_present=%s\n' "$([[ -c /dev/kvm ]] && echo true || echo false)"
            ls -l /dev/kvm 2>&1 || true
          } | tee "$report"
          if [[ ! -c /dev/kvm ]]; then
            echo 'KVM_DEVICE_MISSING' | tee -a "$report" >&2
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          {
            printf 'device_readable=%s\n' "$([[ -r /dev/kvm ]] && echo true || echo false)"
            printf 'device_writable=%s\n' "$([[ -w /dev/kvm ]] && echo true || echo false)"
            ls -l /dev/kvm
          } | tee -a "$report"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM_DEVICE_NOT_ACCESSIBLE' | tee -a "$report" >&2
            exit 1
          fi

      - name: Create and boot accelerated API 35 emulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          AVD_NAME=localai-api35-x86_64
          AVD_ANDROID_HOME="${ANDROID_HOME:-}"
          AVDMANAGER="$AVD_ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$AVD_ANDROID_HOME/emulator/emulator"

          {
            for variable in HOME ANDROID_HOME ANDROID_SDK_ROOT ANDROID_USER_HOME ANDROID_AVD_HOME ANDROID_SDK_HOME; do
              if [[ -v "$variable" ]]; then
                printf '%s=%s\n' "$variable" "${!variable}"
              else
                printf '%s=<unset>\n' "$variable"
              fi
            done
            printf 'resolved_android_sdk_root=%s\n' "$(realpath -m "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" 2>/dev/null || printf '%s' '<unresolved>')"
            printf 'avdmanager_executable=%s\n' "$(realpath -m "$AVDMANAGER" 2>/dev/null || printf '%s' "$AVDMANAGER")"
            printf 'emulator_executable=%s\n' "$(realpath -m "$EMULATOR" 2>/dev/null || printf '%s' "$EMULATOR")"
          } > "$RUNNER_TEMP/avd-environment.txt"

          declare -a AVD_SEARCH_DIRS=()
          add_avd_search_dir() {
            local candidate="${1:-}"
            [[ -n "$candidate" ]] || return 0
            local resolved
            resolved="$(realpath -m "$candidate" 2>/dev/null || printf '%s' "$candidate")"
            local existing
            for existing in "${AVD_SEARCH_DIRS[@]}"; do
              [[ "$existing" == "$resolved" ]] && return 0
            done
            AVD_SEARCH_DIRS+=("$resolved")
          }
          if [[ -n "${ANDROID_AVD_HOME:-}" ]]; then add_avd_search_dir "$ANDROID_AVD_HOME"; fi
          if [[ -n "${ANDROID_USER_HOME:-}" ]]; then add_avd_search_dir "$ANDROID_USER_HOME/avd"; fi
          if [[ -n "${ANDROID_SDK_HOME:-}" ]]; then add_avd_search_dir "$ANDROID_SDK_HOME/avd"; fi
          if [[ -n "${HOME:-}" ]]; then add_avd_search_dir "$HOME/.android/avd"; fi
          {
            printf 'expected_avd_name=%s\n' "$AVD_NAME"
            printf 'resolved_search_directory_count=%s\n' "${#AVD_SEARCH_DIRS[@]}"
            for directory in "${AVD_SEARCH_DIRS[@]}"; do
              if [[ -d "$directory" ]]; then exists=true; else exists=false; fi
              printf 'search_directory=%s exists=%s\n' "$directory" "$exists"
            done
          } > "$RUNNER_TEMP/avd-resolved-paths.txt"

          # Preserve the original create pipeline and its pipefail outcome, but
          # record avdmanager's own status before collecting pre-launch evidence.
          set +e
          printf 'no\n' | "$AVDMANAGER" create avd --force \
            --name localai-api35-x86_64 \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_2 2>&1 | tee "$RUNNER_TEMP/avdmanager.log"
          create_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          avdmanager_create_exit_code="${create_pipeline_status[1]:-127}"
          create_pipeline_exit_code=0
          for code in "${create_pipeline_status[@]}"; do
            if (( code != 0 )); then create_pipeline_exit_code="$code"; fi
          done
          printf '%s\n' "$avdmanager_create_exit_code" > "$RUNNER_TEMP/avdmanager-create-exit-code.txt"
          printf '%s\n' "$create_pipeline_exit_code" > "$RUNNER_TEMP/avdmanager-create-pipeline-exit-code.txt"
          printf '%s\n' "${create_pipeline_status[*]}" > "$RUNNER_TEMP/avdmanager-create-pipeline-status.txt"

          # Diagnostics are best-effort and must not alter the previous create,
          # launch, or wait behavior. Each command gets its own exit-code file.
          set +e
          run_avd_diagnostic() {
            local output="$1"
            shift
            "$@" > "$output" 2>&1
            local result=$?
            printf '%s\n' "$result" > "$output.exit-code"
            return 0
          }
          run_avd_diagnostic "$RUNNER_TEMP/avdmanager-list-avd.txt" "$AVDMANAGER" list avd
          run_avd_diagnostic "$RUNNER_TEMP/emulator-list-avds.txt" "$EMULATOR" -list-avds

          inventory="$RUNNER_TEMP/avd-storage-inventory.txt"
          : > "$inventory"
          for directory in "${AVD_SEARCH_DIRS[@]}"; do
            printf 'search_directory=%s\n' "$directory" >> "$inventory"
            file_list="$RUNNER_TEMP/avd-storage-files.tmp"
            if [[ -d "$directory" ]]; then
              find "$directory" -maxdepth 2 -type f \( -name '*.ini' -o -name 'config.ini' \) -print > "$file_list" 2>> "$inventory"
              find_exit_code=$?
              printf 'find_exit_code=%s\n' "$find_exit_code" >> "$inventory"
              while IFS= read -r file; do
                [[ -n "$file" ]] || continue
                printf 'file=%s\n' "$file" >> "$inventory"
                sha256sum "$file" >> "$inventory" 2>&1
                if [[ "$(basename "$file")" == "$AVD_NAME.ini" || "$(basename "$file")" == config.ini ]]; then
                  grep -E '^(path|path\.rel|target|image\.sysdir\.1|abi\.type)=' "$file" >> "$inventory" 2>&1 || true
                fi
              done < "$file_list"
            else
              printf 'directory_exists=false\n' >> "$inventory"
            fi
            printf 'expected_ini=%s/%s.ini exists=' "$directory" "$AVD_NAME" >> "$inventory"
            if [[ -f "$directory/$AVD_NAME.ini" ]]; then printf 'true\n' >> "$inventory"; else printf 'false\n' >> "$inventory"; fi
            printf 'expected_config=%s/%s/config.ini exists=' "$directory" "$AVD_NAME" >> "$inventory"
            if [[ -f "$directory/$AVD_NAME/config.ini" ]]; then printf 'true\n' >> "$inventory"; else printf 'false\n' >> "$inventory"; fi
          done

          AVD_NAME="$AVD_NAME" python3 - "$RUNNER_TEMP" "${AVD_SEARCH_DIRS[@]}" > "$RUNNER_TEMP/avd-prelaunch.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          name = os.environ["AVD_NAME"]

          def read_code(filename):
              try:
                  return int((root / filename).read_text(encoding="utf-8").strip())
              except (OSError, ValueError):
                  return None

          def listed(filename):
              try:
                  lines = (root / filename).read_text(encoding="utf-8").splitlines()
                  if filename == "avdmanager-list-avd.txt":
                      return any(line.strip() == f"Name: {name}" for line in lines)
                  return name in {line.strip() for line in lines}
              except OSError:
                  return False

          paths = []
          for value in sys.argv[2:]:
              directory = Path(value)
              ini = directory / f"{name}.ini"
              config = directory / name / "config.ini"
              paths.append({
                  "searchDirectory": str(directory),
                  "directoryExists": directory.is_dir(),
                  "expectedIni": str(ini),
                  "iniExists": ini.is_file(),
                  "expectedConfig": str(config),
                  "configExists": config.is_file(),
              })

          result = {
              "capturedBeforeLaunch": True,
              "expectedAvdName": name,
              "avdmanagerCreateExitCode": read_code("avdmanager-create-exit-code.txt"),
              "createPipelineExitCode": read_code("avdmanager-create-pipeline-exit-code.txt"),
              "avdmanagerListExitCode": read_code("avdmanager-list-avd.txt.exit-code"),
              "avdmanagerListedExpected": listed("avdmanager-list-avd.txt"),
              "emulatorListExitCode": read_code("emulator-list-avds.txt.exit-code"),
              "emulatorListedExpected": listed("emulator-list-avds.txt"),
              "searchPaths": paths,
          }
          json.dump(result, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY
          prelaunch_json_exit_code=$?
          printf '%s\n' "$prelaunch_json_exit_code" > "$RUNNER_TEMP/avd-prelaunch-json-exit-code.txt"
          set -e

          # Keep the original fail-fast result for the create pipeline, after
          # writing diagnostics that the always-run collector can upload.
          if (( create_pipeline_exit_code != 0 )); then exit "$create_pipeline_exit_code"; fi

          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd localai-api35-x86_64 \
            -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -memory 2048 -cores 2 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"
          timeout 600 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 120); do
            booted="$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = '1' ]; then break; fi
            if [ "$attempt" -eq 120 ]; then
              echo 'Emulator did not finish booting in 10 minutes' >&2
              exit 1
            fi
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" devices -l | tee "$RUNNER_TEMP/adb-before-tests.txt"
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82 || true
          api="$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d '\r')"
          abi="$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$api" = '35'
          test "$abi" = 'x86_64'

      - name: Run all connected Android instrumentation tests
        id: connected
        timeout-minutes: 55
        shell: bash
        run: |
          set +e
          ./gradlew :app:connectedDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-connected.log"
          gradle_status="${PIPESTATUS[0]}"
          printf 'exit_code=%s\n' "$gradle_status" >> "$GITHUB_OUTPUT"
          exit "$gradle_status"

      - name: Collect and validate instrumentation evidence
        if: always()
        env:
          GRADLE_EXIT_CODE: ${{ steps.connected.outputs.exit_code }}
          ANDROID_CI_EVIDENCE_DIR: ${{ runner.temp }}/android-emulator-evidence
        run: |
          set +e
          python3 scripts/ci/collect_android_emulator_evidence.py
          result=$?
          exit "$result"

      - name: Upload sanitized emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-emulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-emulator-evidence/
          if-no-files-found: error
          retention-days: 7
