name: Personal QA Debug APK (ARM64; not a release)

on:
  push:
    branches:
      - feat/0.5.0-skills-agents
    paths:
      - '.github/workflows/qa-personal-debug-arm64.yml'
      - 'app/build.gradle.kts'
      - 'scripts/ci/build_qa_debug_arm64.py'
      - 'scripts/ci/verify_qa_debug_apk_integrity.py'
      - 'app/src/main/java/com/localai/workspace/MainActivity.kt'
      - 'app/src/main/java/com/localai/workspace/ui/ChatContent.kt'
      - 'app/src/main/java/com/localai/workspace/ui/ContextMemoryUi.kt'
      - 'app/src/test/java/com/localai/workspace/ui/ChatVisualSurfacesUiTest.kt'
  workflow_dispatch:
    inputs:
      parallel_install:
        description: "Use a separate applicationId for import testing without replacing the installed app"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  personal-qa-arm64:
    name: Build personal Debug ARM64 APK (no Android tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Require persistent personal QA signing secrets
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
        run: |
          mkdir -p "$QA_ARTIFACT_DIR/logs"
          set -o pipefail
          python3 - <<'PY' | tee "$QA_ARTIFACT_DIR/logs/signing-preflight.log"
          import os, sys
          names = ("QA_KEYSTORE_B64", "QA_KEYSTORE_PASSWORD", "QA_KEY_ALIAS", "QA_KEY_PASSWORD")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              print("MISSING_REQUIRED_ACTIONS_SECRETS=" + ",".join(missing))
              sys.exit(1)
          print("PERSISTENT_QA_SIGNING_SECRETS_PRESENT")
          PY

      - name: Initialize personal QA evidence
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64
        run: |
          mkdir -p "$QA_ARTIFACT_DIR/logs"
          python3 - "$QA_ARTIFACT_DIR/RESULTS.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump({
                  "status": "NOT_STARTED",
                  "artifactType": "PERSONAL_QA_DEBUG_ARM64_NOT_FOR_PRODUCTION",
                  "warning": "Personal Debug QA build. Not a Release, production distribution, emulator test, or physical-device validation.",
                  "sourceCommit": os.environ["GITHUB_SHA"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  "androidInstrumentation": {"status": "NOT_RUN", "reason": "This personal APK workflow does not invoke connected or instrumented tests."},
                  "instrumentedTests": "NOT_RUN",
                  "emulator": "NOT_RUN",
                  "physicalDevice": "NOT_RUN"
              }, output, indent=2)
              output.write("\n")
          PY

      - name: Build and verify Debug ARM64 APK
        timeout-minutes: 65
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64
          QA_KEYSTORE_B64: ${{ secrets.QA_KEYSTORE_B64 }}
          QA_KEYSTORE_PASSWORD: ${{ secrets.QA_KEYSTORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.QA_KEY_PASSWORD }}
          QA_REQUIRE_PERSISTENT_SIGNING: 'true'
          QA_PARALLEL_INSTALL: ${{ inputs.parallel_install }}
        run: |
          set -o pipefail
          python3 scripts/ci/build_qa_debug_arm64.py 2>&1 | tee "$QA_ARTIFACT_DIR/logs/workflow-build.log"

      - name: Verify APK ZIP integrity and alignment
        id: apk-integrity
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64
          QA_PARALLEL_INSTALL: ${{ inputs.parallel_install }}
        run: |
          set -euo pipefail
          if [[ "${QA_PARALLEL_INSTALL,,}" == "true" ]]; then
            apk="$QA_ARTIFACT_DIR/local-ai-workspace-0.5.0-debug-arm64-parallel.apk"
          else
            apk="$QA_ARTIFACT_DIR/local-ai-workspace-0.5.0-debug-arm64.apk"
          fi
          log="$QA_ARTIFACT_DIR/logs/apk-integrity.log"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_SDK_ROOT_UNAVAILABLE" | tee "$log"
            exit 1
          fi
          zipalign="$sdk_root/build-tools/35.0.0/zipalign"
          if [[ ! -x "$zipalign" ]]; then
            echo "ZIPALIGN_NOT_FOUND=$zipalign" | tee "$log"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT_RESOLVED=$sdk_root" | tee "$log"
          python3 scripts/ci/verify_qa_debug_apk_integrity.py "$apk" 2>&1 | tee -a "$log"
          "$zipalign" -c -v 4 "$apk" 2>&1 | tee -a "$log"
          echo 'zip_integrity=PASS' >> "$GITHUB_OUTPUT"
          echo 'zipalign=PASS' >> "$GITHUB_OUTPUT"

      - name: Finalize report and SHA-256 manifest
        if: always()
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64
          JOB_STATUS: ${{ job.status }}
          ZIP_INTEGRITY: ${{ steps.apk-integrity.outputs.zip_integrity }}
          ZIPALIGN: ${{ steps.apk-integrity.outputs.zipalign }}
        run: |
          python3 - "$QA_ARTIFACT_DIR" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)
          report_path = root / "RESULTS.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {}
          report["artifactType"] = "PERSONAL_QA_DEBUG_ARM64_NOT_FOR_PRODUCTION"
          report["warning"] = "Personal Debug QA build. Not a Release, production distribution, emulator test, or physical-device validation."
          report["sourceCommit"] = os.environ.get("GITHUB_SHA")
          report["runId"] = os.environ.get("GITHUB_RUN_ID")
          report["runAttempt"] = os.environ.get("GITHUB_RUN_ATTEMPT")
          report["runUrl"] = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          report["androidInstrumentation"] = {"status": "NOT_RUN", "reason": "This personal APK workflow does not invoke connected or instrumented tests."}
          report["instrumentedTests"] = "NOT_RUN"
          report["emulator"] = "NOT_RUN"
          report["physicalDevice"] = "NOT_RUN"
          validation = report.setdefault("validation", {})
          validation["apkZipIntegrity"] = os.environ.get("ZIP_INTEGRITY") or "NOT_CONFIRMED"
          validation["zipalign"] = os.environ.get("ZIPALIGN") or "NOT_CONFIRMED"
          if os.environ.get("JOB_STATUS") != "success":
              report["status"] = "FAIL"
              report.setdefault("failureReason", "A required setup, build, or APK validation step failed before a verified personal QA artifact was produced.")
          report["workflowJobStatus"] = os.environ.get("JOB_STATUS", "unknown").upper()
          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          files = sorted(path for path in root.rglob("*") if path.is_file() and path.name != "SHA256SUMS")
          manifest = "\n".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}" for path in files)
          (root / "SHA256SUMS").write_text(manifest + ("\n" if manifest else ""), encoding="utf-8")
          PY

      - name: Upload personal QA APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-ai-workspace-personal-qa-debug-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-ai-workspace-personal-qa-arm64/
          if-no-files-found: error
          retention-days: 30
